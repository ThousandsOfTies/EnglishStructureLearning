name: Publish learning app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the curriculum and test the exercises
        run: |
          python3 scripts/build_construction_app.py
          node --test tests/*.test.cjs
      - name: Collect the app and its illustrations
        run: |
          mkdir -p _site/assets/tense
          cp index.html _site/
          jq -r '(.images[], .details[]) | .file // empty' data/construction-illustrations.json |
            sort -u | xargs -d '\n' cp --parents -t _site --
          cp -r assets/tense/examples-10 _site/assets/tense/
          cp -r assets/calendar _site/assets/
          cp --parents assets/character-materials/modal-speakers/girl-modal-poses.png _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
