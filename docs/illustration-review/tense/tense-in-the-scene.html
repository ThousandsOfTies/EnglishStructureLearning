<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掃除中の部屋と片づいた部屋</title>
<link rel="stylesheet" href="preview.css">
<style>
  #tense-in-the-scene {--mark:var(--viz-series-1,var(--foreground));color:var(--foreground);display:grid;gap:1em}
  #tense-in-the-scene .scenes {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.35em}
  #tense-in-the-scene h3 {margin:0}
  #tense-in-the-scene .drawing {position:relative;aspect-ratio:1.42;margin-top:.55em}
  #tense-in-the-scene .room {position:absolute;left:0;bottom:4%;width:100%;height:83%;object-fit:contain;object-position:bottom}
  #tense-in-the-scene .actor {position:absolute;left:27%;bottom:10%;width:54%;height:78%;object-fit:contain;object-position:bottom}
  #tense-in-the-scene .dust {
    position:absolute;bottom:11%;left:5%;width:44%;height:12%;
    background-image:radial-gradient(circle,#6a5039 12%,transparent 20%),radial-gradient(circle,#8d6447 9%,transparent 19%);
    background-size:17px 13px,13px 16px;background-position:2px 4px,6px 10px;
    clip-path:polygon(6% 11%,100% 0,87% 84%,0 100%);
  }
  #tense-in-the-scene .clean-strip {
    position:absolute;bottom:10%;left:38%;width:45%;height:15%;
    background:linear-gradient(170deg,#fff1ceaa,#fff4d650);
    clip-path:polygon(13% 10%,90% 15%,100% 100%,0 88%);
  }
  #tense-in-the-scene .memory {
    position:absolute;left:1%;top:0;width:26%;height:39%;border:2px solid var(--mark);
    border-radius:45%;background:var(--background);
    display:grid;place-items:center;z-index:2;
  }
  #tense-in-the-scene .memory img {width:82%;height:87%;object-fit:contain}
  #tense-in-the-scene .link {
    position:absolute;left:21%;top:37%;width:30%;height:38%;
    border-left:2px dashed var(--mark);border-bottom:2px dashed var(--mark);
    border-bottom-left-radius:30px;transform:skewX(19deg)
  }
  #tense-in-the-scene .link::after {
    content:"";position:absolute;right:-3px;bottom:-4px;width:6px;height:6px;
    border-radius:50%;background:var(--mark)
  }
  #tense-in-the-scene .sparkle {
    position:absolute;left:50%;top:72%;color:#735324;background:#fff4df;
    border-radius:50%;padding:.12em .28em;line-height:1
  }
  #tense-in-the-scene .reading {margin-top:.3em}
  #tense-in-the-scene:has(input:not(:checked)) .reading {visibility:hidden}
  @media(max-width:600px) {
    #tense-in-the-scene .scenes {grid-template-columns:minmax(0,1fr)}
    #tense-in-the-scene .scene {width:100%;max-width:460px}
  }
</style>
</head>
<body>
<div id="tense-in-the-scene">
  <div class="viz-controls">
    <label class="form-check">
      <input class="form-check-input" type="checkbox" checked>
      <span>場面の説明を表示</span>
    </label>
  </div>
  <div class="scenes">
    <section class="scene">
      <h3>現在進行形</h3>
      <div class="drawing" role="img" aria-label="女の子が掃除機をかけている。床には、ほこりが残る部分と掃除した部分がある。">
        <img class="room" src="../../../assets/tense/tidy-room.png" alt="">
        <span class="clean-strip"></span>
        <span class="dust"></span>
        <img class="actor" src="../../../assets/tense/cleaning.png" alt="">
      </div>
      <p class="reading">きれいにしている途中の部屋</p>
    </section>
    <section class="scene">
      <h3>現在完了形（結果）</h3>
      <div class="drawing" role="img" aria-label="掃除機が片づき、床全体がきれいになった部屋。床から点線をたどると、小さい吹き出しに先ほど掃除をしていた女の子が見える。">
        <img class="room" src="../../../assets/tense/tidy-room.png" alt="">
        <span class="link"></span>
        <span class="sparkle" aria-hidden="true">✦</span>
        <div class="memory"><img src="../../../assets/tense/cleaning.png" alt=""></div>
      </div>
      <p class="reading">きれいな部屋に、さっきの掃除がつながる</p>
    </section>
  </div>
</div>
</body>
</html>
