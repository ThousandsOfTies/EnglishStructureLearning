<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ことばのならべかた｜自分で英文をつくろう</title>
<style>
__CONSTRUCTION_CSS__
</style>
</head>
<body>
<dialog id="lessonDrawer" class="lesson-drawer" aria-labelledby="drawerTitle">
<div class="drawer-content">
<div class="drawer-heading"><h2 id="drawerTitle">例文をえらぶ</h2><button id="closeMenu" class="drawer-close" type="button" aria-label="例文メニューを閉じる" autofocus>×</button></div>
<fieldset id="levels" class="levels"><legend>レベル</legend><div id="levelChoices" class="level-choices"></div></fieldset>
<fieldset class="course-filters" aria-label="ミニセットの設定">
<label for="courseTheme">場面のテーマ</label><select id="courseTheme"></select>
<progress id="themeProgress" aria-label="選んだ場面の達成度"></progress>
<label class="check-option"><input type="checkbox" id="miniView" aria-controls="courseTheme courseSet lessons" checked> ミニセット</label>
<select id="courseSet" aria-label="練習するミニセット"></select>
</fieldset>
<label class="check-option"><input type="checkbox" id="autoSpeak"> 正解したら英文を読み上げる</label>
<p id="artworkProgress" class="muted"></p>
<p class="muted wide" id="filterCount" aria-live="polite"></p><nav class="lessons wide" id="lessons" aria-label="例文一覧"></nav>
</div>
</dialog>
<dialog id="levelGuide" class="level-guide" aria-labelledby="guideTitle" aria-describedby="guideSummary">
<div class="guide-content" id="guideContent">
<h2 id="guideTitle"></h2>
<p id="guideSummary"></p>
<p id="guideIntroduction" hidden></p>
<div id="guideExamples"></div>
<section class="guide-question-words" id="guideQuestionWords" aria-labelledby="guideQuestionTitle" hidden>
<h3 id="guideQuestionTitle">疑問主部の例</h3>
<dl id="guideQuestionExamples"></dl>
</section>
<p id="guideNote" class="guide-note"></p>
</div>
<form method="dialog" class="guide-actions"><button id="guideContinue" type="submit" autofocus>はじめる</button></form>
</dialog>
<div class="wrap"><div class="practice-pane" id="practicePane"><main class="sheet" id="main">
<div class="practice-toolbar">
<button id="openMenu" class="menu-button" type="button" aria-label="例文メニューを開く" aria-controls="lessonDrawer" aria-haspopup="dialog" aria-expanded="false"><span class="menu-icon" aria-hidden="true"></span></button>
<div class="mode-switcher" id="modeSwitcher" role="group" aria-label="練習のしかた"><button id="cardsMode" aria-pressed="true">カードを並べる</button><button id="selectMode" aria-pressed="false">絵を見てえらぶ</button><span id="reviewMode" class="review-indicator" hidden>英語カードで復習中</span></div>
<div class="example-position"><progress id="examplePosition" aria-label="表示中の例文の位置" max="1" value="0"></progress><span id="examplePositionText" aria-hidden="true"></span></div>
<button id="reset">初めに戻す</button>
<button id="openGuide" class="menu-button" type="button" aria-label="このレベルの説明を開く" aria-controls="levelGuide" aria-haspopup="dialog" aria-expanded="false">？</button>
</div>
<p id="emptyPractice" class="muted" hidden>左上のメニューから、練習する例文をえらんでね。</p>
<div id="exercise">
<div class="scene-navigation" id="sceneNavigation" role="group" aria-label="場面を切り替える">
<button id="previous" class="scene-arrow" type="button" aria-label="前の場面"></button>
<div class="prompt"><p class="japanese" id="japanese"></p></div>
<div id="pictureScene" class="picture-scene" hidden></div>
<button id="next" class="scene-arrow" type="button" aria-label="次の場面"></button>
</div>
<div id="pool" class="pool" data-drop="" role="group" aria-label="まだ置いていないカード・ここに戻せます"></div>
<div class="slot-stack">
<div id="slots" class="slots" role="group" aria-label="英文を組み立てる欄"></div>
</div>
<button id="check" class="check-answer" type="button"><span aria-hidden="true">✅</span> チェックする</button>
<div id="feedback" role="status" aria-live="polite"></div><div id="result"></div>
</div>
</main><footer>オリジナル教材・試作版。進み具合はこのブラウザーに保存されます。<span id="storageStatus"></span></footer></div></div>
<script id="curriculum" type="application/json">__CONSTRUCTION_DATA__</script><script id="illustrations" type="application/json">__ILLUSTRATION_DATA__</script><script>
__CONSTRUCTION_SCRIPT__
</script></body></html>
