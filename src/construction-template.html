<style>

-template-columns:repeat(auto-fit,minmax(110px,1fr))}.advanced .target{font-size:15px;min-height:55px}.advanced .slot{min-height:150px}footer{margin-top:22px;font-size:12px;color:var(--muted)}#selectedStatus{min-height:24px}.scope-note{margin-top:10px}
@media(max-width:1100px){.slots{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.wrap{padding:12px}.layout{grid-template-columns:minmax(0,1fr);gap:16px}.sheet{padding:20px 14px}.lessons{max-height:150px}aside{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}aside .wide{grid-column:1/-1}.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.japanese{font-size:20px}.full-english{font-size:23px}.topline{flex-wrap:wrap}.card{font-size:17px}.advanced .slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}.card:active{cursor:grabbing}.drag-source{opacity:.3}.drag-ghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-40%,-50%) rotate(-2deg);box-shadow:0 12px 28px #263e5030;max-width:85vw;background:#fff}.drop-hover{outline:3px solid #3d83bd;outline-offset:3px;background:#e4f1fb!important}

/* Keep navigation on the left and fit the six slots into the remaining width. */
.wrap{max-width:none;height:100dvh;padding-bottom:0}.layout{height:100%;grid-template-columns:clamp(180px,20vw,260px) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}.layout>aside{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}.practice-pane{min-width:0;min-height:0;overflow:auto;overscroll-behavior-y:contain;scrollbar-gutter:stable;padding-bottom:12px}.levels{margin:0;padding:0;border:0;min-width:0}.levels legend{padding:0;font-size:13px;font-weight:bold}.level-choices{display:flex;gap:4px;margin-top:4px}.level-choices label{display:flex;justify-content:center;align-items:center;gap:3px;min-height:44px;flex:1;margin:0;cursor:pointer;border:1px solid #b9c9d2;border-radius:9px;background:#fff}.level-choices label:has(:checked){background:#e7f0f8;border-color:var(--blue)}.level-choices input{width:14px;height:14px;min-height:0;margin:0;padding:0;accent-color:var(--blue)}.layout>aside>:not(.lessons){flex:none}.lessons{display:flex;flex-direction:column;flex:1;gap:6px;min-height:56px;max-height:none;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;padding:3px 5px 5px 3px}.lessons button{flex-shrink:0;width:100%;overflow-wrap:anywhere}.slots{display:flex;flex-wrap:nowrap;width:100%;min-width:0;gap:clamp(3px,1vw,12px);padding:5px 0;align-items:stretch}.slots>.slot{flex:1 1 0;min-width:0;padding:clamp(3px,1vw,12px);overflow-wrap:anywhere}.slot .target{font-size:clamp(12px,1.6vw,20px)}.slot .target small{font-size:clamp(9px,1vw,12px)}.slot select{min-width:0;max-width:100%;font-size:clamp(11px,1.2vw,16px);padding:8px clamp(1px,.6vw,8px)}
@media(max-width:720px){.layout{grid-template-columns:125px minmax(0,1fr);gap:10px}.layout>aside label,.layout>aside select,.layout>aside input,.lessons button{font-size:12px}.sheet{padding-left:8px;padding-right:8px}.slot .card{padding:6px 2px;font-size:12px}}
@media(max-width:480px){.slot label.target{line-height:1.25;min-height:calc(3lh + 4px)}}
.slot.locked{background:#eceeef;border-color:#d4d9dd;color:#8a939a}.slot.locked .target,.slot.locked .target small{color:#8a939a}.slot.locked select{background:#e2e5e7;color:#8a939a;border-color:#cdd3d7;cursor:not-allowed}.slot.locked button:disabled{opacity:1;cursor:not-allowed}
.pool{display:block}.pool-cards{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.picture-scene{width:100%;max-width:760px}.scene-illustration{width:100%;height:auto;max-height:420px;object-fit:contain;background:#fff9ee}.scene-clue{font-size:13px;color:var(--muted);margin-top:9px;padding:8px 12px;background:#f7f6ef;border-radius:9px;text-align:center}
.slot select.placeholder{color:#87929b}.slot select.has-choice{color:var(--ink)}.slot select option{color:var(--ink)}.slot select option[value="__unanswered__"]{color:#87929b}.slot.locked select{color:#8a939a}
.scene-visual{position:relative}
.day-calendar{position:absolute;top:4%;right:4%;width:clamp(44px,12%,86px);aspect-ratio:1/1.04;border:2px solid #8a5132;border-radius:12%;background:linear-gradient(#d3503d 20%,#fff5de 20%);isolation:isolate}
.day-calendar::before,.day-calendar::after{content:"";position:absolute;top:-7%;width:7%;height:18%;border:1px solid #704b32;border-radius:999px;background:#fff2d5}
.day-calendar::before{left:24%}.day-calendar::after{right:24%}
.daily-calendar{width:clamp(66px,14%,100px);aspect-ratio:1.25;border-radius:10%}
.daily-checks{position:absolute;inset:32% 7% 12%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(2,1fr);place-items:center}
.daily-checks span{width:74%;aspect-ratio:1.6;border:solid #1d7347;border-width:0 0 2px 2px;border-radius:0 0 0 1px;transform:rotate(-45deg);margin-top:-2px}
.day-calendar img{position:absolute;left:13%;top:24%;width:74%;height:69%;object-fit:contain;pointer-events:none}
.day-orbit{--orbit-stroke:clamp(2px,.35vw,4px);--orbit-outline:#39253e;position:absolute;z-index:1;left:6%;right:6%;top:49%;height:26%;color:#ffe24f;transform:rotate(-9deg);filter:drop-shadow(1px 0 0 var(--orbit-outline)) drop-shadow(-1px 0 0 var(--orbit-outline)) drop-shadow(0 1px 0 var(--orbit-outline)) drop-shadow(0 -1px 0 var(--orbit-outline))}
.day-orbit::before{content:"";position:absolute;inset:0 1% 0 7%;border:var(--orbit-stroke) solid currentColor;border-radius:50%;clip-path:polygon(10% 58%,86% 58%,86% 0,100% 0,100% 100%,10% 100%)}
.day-orbit::after{content:"";position:absolute;left:3%;top:49%;width:18%;height:65%;background:currentColor;clip-path:polygon(0 28%,90% 0,100% 100%)}
.day-calendar.tomorrow .day-orbit{color:#ff9ac3;transform:scaleX(-1) rotate(-9deg)}
.speech-controls{gap:6px}.speech-controls select{min-width:4.5em;max-width:min(7em,100%);field-sizing:content;text-overflow:ellipsis}
.speech-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}.speech-buttons button{white-space:nowrap;padding:8px 10px}
.practice-toolbar{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}.practice-toolbar .mode-switcher{margin:0}.practice-toolbar #reset{margin-inline-start:auto;flex:none;white-space:nowrap}
@media(max-width:540px){.practice-toolbar{flex-direction:column;align-items:stretch}.practice-toolbar #reset{align-self:flex-end;order:-1}}
.scene-navigation{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;column-gap:clamp(4px,1vw,12px);margin-bottom:18px}
.scene-navigation .prompt,.scene-navigation .picture-scene{grid-column:2;grid-row:1;min-width:0;margin:0 auto}
.scene-navigation .prompt{width:100%;padding:12px clamp(8px,2vw,20px);overflow-wrap:anywhere}
.scene-navigation .scene-clue{grid-column:2;grid-row:2;justify-self:center;width:100%;max-width:760px;margin:9px 0 0}
.scene-navigation:not(.picture-mode) .picture-scene{grid-column:1/-1;grid-row:2;margin-top:8px}
.scene-navigation:not(.picture-mode) .scene-clue{grid-column:1/-1;grid-row:3}
.scene-arrow{display:grid;place-items:center;width:44px;height:44px;padding:0;grid-row:1;color:var(--blue)}
.scene-arrow::before{content:"";width:10px;height:10px;border:solid currentColor;border-width:2px 2px 0 0;transform:translateX(-2px) rotate(45deg)}
#previous::before{transform:translateX(2px) rotate(-135deg)}
#previous{grid-column:1}#next{grid-column:3}
.check-answer{display:block;width:100%;min-height:44px;margin-top:4px;padding:6px 12px;background:var(--blue);border-color:var(--blue);color:white;font-weight:600}
.check-answer:hover:enabled{background:#204c74;color:white}
.feedback.retry{background:var(--paper);color:var(--ink)}
</style>

<body><div class="wrap">
<div class="layout"><aside aria-label="例文をえらぶ">

</div>
