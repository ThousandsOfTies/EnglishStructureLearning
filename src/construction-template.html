<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ことばのならべかた｜自分で英文をつくろう</title>
<style>
:root{--ink:#263e50;--muted:#647887;--line:#d9e2e5;--blue:#275e91;--paper:#f6f4ee}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Yu Gothic UI",Meiryo,sans-serif;line-height:1.7}button,select,input{font:inherit;color:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px}button:hover:enabled{border-color:var(--blue);background:#edf4fa}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #d99728;outline-offset:3px}button[aria-pressed=true],button[aria-current=true]{background:#e7f0f8;border-color:var(--blue)}h2{font-size:22px;margin:0 0 8px}p{margin:8px 0}.wrap{height:100dvh;padding:12px 24px 0}.muted{font-size:13px;color:var(--muted)}select,input{width:100%;min-height:44px;border:1px solid #b9c9d2;border-radius:9px;background:white;padding:8px}.lessons button{text-align:left;font-size:13px;padding:9px 11px}.sheet{background:white;border:1px solid var(--line);border-radius:22px;padding:26px;min-width:0;box-shadow:0 8px 32px #17394c06}.topline{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:18px}.tag{font-size:12px;color:var(--blue);background:#edf4fa;padding:4px 10px;border-radius:20px}.prompt{background:#f7f6f1;border-radius:15px}.japanese{font-size:22px;font-weight:600}.pool{border:2px dashed #bdccd3;border-radius:14px;padding:6px 8px;margin:8px 0}.card{font-size:18px;box-shadow:0 3px 0 #263e5010}.card.selected{outline:3px solid #e5af43;outline-offset:2px}.slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.slot{border:2px solid var(--slot-color,#c7d2d8);background:var(--slot-bg,#f7f9fa)}:is(.slot,.answer-part)[data-role=S]{--slot-color:#a8c9e7;--slot-bg:#f0f6fc}:is(.slot,.answer-part):is([data-role=predicate],[data-role=述語],[data-role=述語の残り]){--slot-color:#dfb5a6;--slot-bg:#fff2eb}:is(.slot,.answer-part)[data-role=P1]{--slot-color:#d6c68b;--slot-bg:#fcf8e8}:is(.slot,.answer-part)[data-role=P2]{--slot-color:#a8cfbc;--slot-bg:#eef8f2}:is(.slot,.answer-part):is([data-role=place],[data-role=場所]){--slot-color:#b9c1de;--slot-bg:#f2f3fa}:is(.slot,.answer-part):is([data-role=time],[data-role=時]){--slot-color:#cbb8d9;--slot-bg:#f8f1fa}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:22px}.feedback{border-radius:12px;padding:13px 16px;margin-top:18px;background:var(--paper);color:var(--ink)}.result{margin-top:20px;border-top:1px solid var(--line);padding-top:18px;text-align:center}.full-english{font-size:26px;font-weight:600;overflow-wrap:anywhere}.spoken{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}.speech-controls{margin-top:12px;justify-content:center}.speech-controls select{width:auto}.answer-part{text-align:left;min-width:0;background:var(--slot-bg,#f0f4f7);border-bottom:3px solid var(--slot-color,#b3c8d8);border-radius:6px;padding:6px 10px;overflow-wrap:anywhere}.answer-label,.answer-ja,.answer-part [lang=en]{display:block}.answer-label{font-size:11px;color:var(--muted)}.answer-part:enabled .answer-label::after{content:" ▶";color:var(--blue)}.answer-ja{font-size:13px}.answer-part [lang=en]{font-weight:600}footer{margin-top:22px;font-size:12px;color:var(--muted)}.scope-note{margin-top:10px}
@media(max-width:1100px){.slots{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.wrap{padding:12px}.sheet{padding:20px 14px}.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.japanese{font-size:20px}.full-english{font-size:23px}.topline{flex-wrap:wrap}.card{font-size:17px}}
.card{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}.card:active{cursor:grabbing}.drag-source{opacity:.3}.drag-ghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-40%,-50%) rotate(-2deg);box-shadow:0 12px 28px #263e5030;max-width:85vw;background:#fff}.drop-hover{outline:3px solid #3d83bd;outline-offset:3px;background:#e4f1fb!important}
.mode-switcher{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 12px}.mode-switcher button{border-radius:24px}.scene-illustration{display:block;width:100%;max-height:350px;object-fit:contain;border-radius:0}.scene-pending{padding:24px;border:1px dashed #b9c9d2;border-radius:15px;background:#f7f9fa;text-align:center}
/* Keep practice and the lesson list independently scrollable. */
.practice-pane{height:100%;min-width:0;overflow:auto;overscroll-behavior-y:contain;scrollbar-gutter:stable;padding-bottom:12px}.levels{margin:0;padding:0;border:0;min-width:0}.levels legend{padding:0;font-size:13px;font-weight:bold}.level-choices{display:flex;gap:4px;margin-top:4px}.level-choices label{display:flex;justify-content:center;align-items:center;gap:3px;min-height:44px;flex:1;margin:0;cursor:pointer;border:1px solid #b9c9d2;border-radius:9px;background:#fff}.level-choices label:has(:checked){background:#e7f0f8;border-color:var(--blue)}.level-choices input{width:14px;height:14px;min-height:0;margin:0;padding:0;accent-color:var(--blue)}.lessons{display:flex;flex-direction:column;flex:1;gap:6px;min-height:56px;max-height:none;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;padding:3px 5px 5px 3px}.lessons button{flex-shrink:0;width:100%;overflow-wrap:anywhere}.slots{display:flex;flex-wrap:nowrap;width:100%;min-width:0;gap:clamp(3px,1vw,12px);padding:5px 0;align-items:stretch}.slots>.slot{flex:1 1 0;min-width:0;padding:clamp(3px,1vw,12px);overflow-wrap:anywhere}
@media(max-width:720px){.sheet{padding-left:8px;padding-right:8px}}

.pool-cards{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px}
.pool-cards .card{font-size:clamp(14px,1.4vw,17px);padding:5px 9px}
.picture-scene{width:100%;max-width:760px}.scene-illustration{width:100%;height:auto;max-height:420px;object-fit:contain;background:#fff9ee}.scene-clue{font-size:13px;color:var(--muted);margin-top:9px;padding:8px 12px;background:#f7f6ef;border-radius:9px;text-align:center}

.scene-visual{position:relative}
.day-calendar{position:absolute;top:4%;right:4%;width:clamp(44px,12%,86px);aspect-ratio:1/1.04;border:2px solid #8a5132;border-radius:12%;background:linear-gradient(#d3503d 20%,#fff5de 20%);isolation:isolate}
.day-calendar::before,.day-calendar::after{content:"";position:absolute;top:-7%;width:7%;height:18%;border:1px solid #704b32;border-radius:999px;background:#fff2d5}
.day-calendar::before{left:24%}.day-calendar::after{right:24%}
.daily-calendar{width:clamp(66px,14%,100px);aspect-ratio:1.25;border-radius:10%}
.daily-checks{position:absolute;inset:32% 7% 12%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(2,1fr);place-items:center}
.daily-checks span{width:74%;aspect-ratio:1.6;border:solid #1d7347;border-width:0 0 2px 2px;border-radius:0 0 0 1px;transform:rotate(-45deg);margin-top:-2px}
.day-calendar img{position:absolute;left:13%;top:24%;width:74%;height:69%;object-fit:contain;pointer-events:none}
.day-orbit{--orbit-stroke:clamp(2px,.35vw,4px);--orbit-outline:#39253e;position:absolute;z-index:1;left:6%;right:6%;top:49%;height:26%;color:#ffe24f;transform:rotate(-9deg);filter:drop-shadow(1px 0 0 var(--orbit-outline)) drop-shadow(-1px 0 0 var(--orbit-outline)) drop-shadow(0 1px 0 var(--orbit-outline)) drop-shadow(0 -1px 0 var(--orbit-outline))}
.day-orbit::before{content:"";position:absolute;inset:0 1% 0 7%;border:var(--orbit-stroke) solid currentColor;border-radius:50%;clip-path:polygon(10% 58%,86% 58%,86% 0,100% 0,100% 100%,10% 100%)}
.day-orbit::after{content:"";position:absolute;left:3%;top:49%;width:18%;height:65%;background:currentColor;clip-path:polygon(0 28%,90% 0,100% 100%)}
.day-calendar.tomorrow .day-orbit{color:#ff9ac3;transform:scaleX(-1) rotate(-9deg)}
.speech-controls{gap:6px}.speech-controls select{min-width:4.5em;max-width:min(7em,100%);field-sizing:content;text-overflow:ellipsis}
.speech-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}.speech-buttons button{white-space:nowrap;padding:8px 10px}
.practice-toolbar{display:grid;grid-template-columns:44px minmax(0,1fr) auto 44px;align-items:start;gap:8px;margin-bottom:12px}.practice-toolbar .mode-switcher{margin:0}.practice-toolbar #reset{grid-column:3;white-space:nowrap}.practice-toolbar #openGuide{grid-column:4}
.menu-button{display:grid;place-items:center;width:44px;height:44px;padding:0;color:var(--blue);font-size:24px;line-height:1}
@media(hover:none){#openMenu:hover:enabled{background:#fff;border-color:var(--line)}}
@media(max-width:540px){.practice-toolbar .mode-switcher{grid-column:1/-1;grid-row:2}.practice-toolbar :is(#reset,#openGuide){grid-row:1}}
.lesson-drawer{position:fixed;inset:0 auto 0 0;margin:0;width:min(440px,calc(100% - 44px));height:100dvh;max-width:none;max-height:none;padding:0;border:0;background:var(--paper);color:var(--ink);box-shadow:4px 0 24px #263e5033}
.lesson-drawer[open]{animation:slide-in .2s ease-out}
.lesson-drawer::backdrop{background:#263e5040}
@keyframes slide-in{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){.lesson-drawer[open]{animation:none}}
.drawer-content{display:flex;flex-direction:column;height:100%;overflow:auto;padding:12px 14px}
.drawer-content>:not(.lessons){flex:none}
#scopeField label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}
.drawer-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.drawer-heading h2{margin:0;font-size:18px}
.drawer-close{width:44px;padding:0;font-size:24px;line-height:1}
.level-choices{display:grid;gap:6px}
.level-choices label{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;padding:5px 9px;line-height:1.35}
.level-choice-name{display:block;font-size:14px}
.level-choice-summary{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.level-guide{width:min(620px,calc(100% - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:16px;color:var(--ink);background:#fff;box-shadow:0 16px 48px #263e5033}
.level-guide[open]{display:flex;flex-direction:column}
.level-guide::backdrop{background:#263e5066}
.guide-content{min-height:0;overflow:auto;padding:clamp(14px,4vw,26px)}
.guide-content h2{margin:0}
.guide-example{margin:10px 0 0;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.guide-example h3{margin:0;font-size:16px;line-height:1.45}
.guide-example :is(.guide-explanation,.guide-practice){font-size:14px;line-height:1.6}
.guide-explanation{margin:5px 0 8px}
.guide-practice{margin:8px 0 0}
.guide-sentence{display:block;font-weight:600;overflow-wrap:anywhere}
.guide-starting-order{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.guide-starting-order [lang=en]{margin-left:4px}
.guide-illustration{float:right;width:clamp(76px,28%,145px);margin:5px 0 4px 9px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.guide-illustration img{display:block;width:100%;height:auto}
/* The Level 2 modal pictures share the same narrator position. */
.guide-illustration-speaker{position:relative;aspect-ratio:215 / 205}
.guide-illustration-speaker img{position:absolute;left:-56%;top:-207%;width:400%}
.guide-illustration-pose{position:relative;aspect-ratio:1;background:#fffcf6}
.guide-illustration-pose img{position:absolute;left:-100%;top:0;width:200%}
.guide-parts{clear:both;display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px;margin-top:8px}
.guide-part{font-size:14px;padding:3px 7px}
.guide-part .answer-label{white-space:nowrap}
.guide-part[data-role="question-marker"]{border:1px dashed #738c9a;background:#fff}
.guide-note{margin:12px 0 0;font-size:13px;color:var(--muted)}
.guide-actions{flex:none;display:flex;justify-content:flex-end;padding:10px clamp(14px,4vw,26px);border-top:1px solid var(--line)}
.guide-actions button{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.guide-actions button:hover:enabled{background:#204c74;color:#fff}
.scene-navigation{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;column-gap:clamp(4px,1vw,12px);margin-bottom:18px}
.scene-navigation .prompt,.scene-navigation .picture-scene{grid-column:2;grid-row:1;min-width:0;margin:0 auto}
.scene-navigation .prompt{width:100%;padding:12px clamp(8px,2vw,20px);overflow-wrap:anywhere}
.scene-navigation .scene-clue{grid-column:2;grid-row:2;justify-self:center;width:100%;max-width:760px;margin:9px 0 0}
.scene-navigation:not(.picture-mode) .picture-scene{grid-column:1/-1;grid-row:2;margin-top:8px}
.scene-navigation:not(.picture-mode) .scene-clue{grid-column:1/-1;grid-row:3}
.scene-arrow{display:grid;place-items:center;width:44px;height:44px;padding:0;grid-row:1;color:var(--blue)}
.scene-arrow::before{content:"";width:10px;height:10px;border:solid currentColor;border-width:2px 2px 0 0;transform:translateX(-2px) rotate(45deg)}
#previous::before{transform:translateX(2px) rotate(-135deg)}
#previous{grid-column:1}#next{grid-column:3}
.slot-stack{display:grid;grid-template-areas:"pre-modifiers" "phrase" "post-modifiers";grid-template-rows:repeat(3,1fr);grid-template-columns:minmax(0,1fr)}
.slot-stack>.slots{grid-area:phrase}
.slot-stack:has(.support-stack){grid-template-rows:54px auto 54px}
.slots:has(>.support-stack){display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:start}
.support-stack{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;min-width:0}
.spoken:has(>.support-stack){align-items:flex-start}
.check-answer{display:block;width:100%;min-height:44px;margin-top:4px;padding:6px 12px;background:var(--blue);border-color:var(--blue);color:white;font-weight:600}
.check-answer:hover:enabled{background:#204c74;color:white}
.slots :is(.list-choice,.card-slot){min-width:0;min-height:44px;padding:4px clamp(2px,.6vw,8px);border-radius:9px;font-size:clamp(11px,1.3vw,15px);overflow-wrap:anywhere}
:is(.slot,.answer-part)[data-role=support]{--slot-color:#dbbea2;--slot-bg:#fcf3e9}
.slots .list-choice{height:44px;text-overflow:ellipsis}
.card-slot{line-height:1.25}
.card-slot:not([data-card]){color:var(--muted)}
.list-choice.placeholder{color:var(--muted)}
:is(.list-choice,.card-slot):disabled{background:#eceeef;border-color:#d4d9dd;color:#687581;opacity:1}
.slot.wrong{border-style:dashed;border-color:#b24b30}
@media(max-width:365px){.slots .list-choice{appearance:none;text-align:center}}
</style>
</head>
<body>
<dialog id="lessonDrawer" class="lesson-drawer" aria-labelledby="drawerTitle">
<div class="drawer-content">
<div class="drawer-heading"><h2 id="drawerTitle">例文をえらぶ</h2><button id="closeMenu" class="drawer-close" type="button" aria-label="例文メニューを閉じる" autofocus>×</button></div>
<fieldset id="levels" class="levels"><legend>レベル</legend><div id="levelChoices" class="level-choices"></div></fieldset>
<div id="scopeField"><label for="scope">レベル1の文</label><select id="scope"><option value="all">すべて</option><option value="core">基本の場面</option><option value="pronouns">代名詞</option><option value="extension">自分自身を表す</option></select></div>
<p id="artworkProgress" class="muted"></p>
<p class="muted wide" id="filterCount" aria-live="polite"></p><nav class="lessons wide" id="lessons" aria-label="例文一覧"></nav>
</div>
</dialog>
<dialog id="levelGuide" class="level-guide" aria-labelledby="guideTitle" aria-describedby="guideSummary">
<div class="guide-content" id="guideContent">
<h2 id="guideTitle"></h2>
<p id="guideSummary"></p>
<p id="guideIntroduction" hidden></p>
<div id="guideExamples"></div>
<p id="guideNote" class="guide-note"></p>
</div>
<form method="dialog" class="guide-actions"><button id="guideContinue" type="submit" autofocus>はじめる</button></form>
</dialog>
<div class="wrap"><div class="practice-pane" id="practicePane"><main class="sheet" id="main">
<div class="practice-toolbar">
<button id="openMenu" class="menu-button" type="button" aria-label="例文メニューを開く" aria-controls="lessonDrawer" aria-haspopup="dialog" aria-expanded="false">☰</button>
<div class="mode-switcher" id="modeSwitcher" role="group" aria-label="練習のしかた"><button id="cardsMode" aria-pressed="true">カードを並べる</button><button id="selectMode" aria-pressed="false">絵を見てえらぶ</button></div>
<button id="reset">初めに戻す</button>
<button id="openGuide" class="menu-button" type="button" aria-label="このレベルの説明を開く" aria-controls="levelGuide" aria-haspopup="dialog" aria-expanded="false">？</button>
</div>
<p id="emptyPractice" class="muted" hidden>左上のメニューから、練習する例文をえらんでね。</p>
<div id="exercise">
<div class="scene-navigation" id="sceneNavigation" role="group" aria-label="場面を切り替える">
<button id="previous" class="scene-arrow" type="button" aria-label="前の場面"></button>
<div class="prompt"><p class="japanese" id="japanese"></p></div>
<div id="pictureScene" class="picture-scene" hidden></div>
<button id="next" class="scene-arrow" type="button" aria-label="次の場面"></button>
<p id="sceneClue" class="scene-clue" hidden></p>
</div>
<div id="pool" class="pool" data-drop="" role="group" aria-label="まだ置いていないカード・ここに戻せます"></div>
<div class="slot-stack">
<div id="slots" class="slots" role="group" aria-label="英文を組み立てる欄"></div>
</div>
<button id="check" class="check-answer" type="button"><span aria-hidden="true">✅</span> チェックする</button>
<div id="feedback" role="status" aria-live="polite"></div><div id="result"></div>
</div>
</main><footer>オリジナル教材・試作版。進み具合はこのブラウザーに保存されます。<span id="storageStatus"></span></footer></div></div>
<script id="curriculum" type="application/json">__CONSTRUCTION_DATA__</script><script id="illustrations" type="application/json">__ILLUSTRATION_DATA__</script><script>
__CONSTRUCTION_SCRIPT__
</script></body></html>
